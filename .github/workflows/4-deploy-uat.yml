name: Release Gate (release/* → main)

# Fires when a PR targeting `main` is opened, reopened, or updated.
# `branches` filters the BASE (target) branch. The head (source) branch
# and the `hotfix` label are enforced inside the uat-validate job, since
# pull_request events can't filter on head branch or labels natively.
# `labeled`/`unlabeled` are included so adding or removing the `hotfix`
# label re-runs the workflow and re-evaluates the checks.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches:
      - main

# UAT is strictly sequential — only one version may enter UAT at a time
# (design: "Sequential UAT constraint"). A STATIC group serializes every
# release/* PR into one lane. `cancel-in-progress: false` queues a second
# release behind the first rather than cancelling the in-flight UAT run.
concurrency:
  group: uat
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────
  # STAGE 1 — runs automatically. No approval needed.
  # ──────────────────────────────────────────────────────────────
  uat-validate:
    name: UAT Validate
    # NOTE: deliberately NO job-level `if:`. This job must run for EVERY PR
    # into main so that, when required in branch protection, it always
    # reports a real status. A *skipped* required check counts as passing,
    # which would let non-release PRs slip into main and bypass the gate.
    runs-on: ubuntu-latest
    steps:
      # GATEKEEPER: only release/* branches may merge into main. Hard-fail
      # (exit 1) anything else — including a non-release branch that tries
      # to sneak in with a `hotfix` label. This is checked first, before
      # any label logic, so the label can never bypass the branch rule.
      - name: Enforce source branch is release/*
        if: ${{ !startsWith(github.head_ref, 'release/') }}
        run: |
          echo "::error::Only release/* branches may merge into main (got '${{ github.head_ref }}')."
          exit 1

      # AGILE HOTFIX PATH: a release/* PR carrying the `hotfix` label skips
      # UAT entirely. The job still succeeds, so the required check goes
      # green automatically — only the pre-prod approval gates this PR.
      - name: Skip UAT (hotfix label present)
        if: ${{ contains(github.event.pull_request.labels.*.name, 'hotfix') }}
        run: echo "Hotfix label present — skipping UAT; only the pre-prod approval gates this PR."

      # NORMAL RELEASE PATH: run real UAT (only when no `hotfix` label).
      - name: Check out PR code
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'hotfix') }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'hotfix') }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # TODO(you): replace with your project's actual UAT checks.
      - name: Run UAT validation
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'hotfix') }}
        run: |
          echo "UAT validation completed"

  # ──────────────────────────────────────────────────────────────
  # STAGE 2 — gated. The UAT / BU sign-off (Branch Flow step 6.a).
  # ──────────────────────────────────────────────────────────────
  uat-signoff:
    name: UAT Sign-off (BU)
    needs: [uat-validate]        # only starts after stage 1 succeeds
    runs-on: ubuntu-latest
    # ↓↓↓ THIS is the UAT sign-off gate, NOT a Pre-Prod gate. Pre-Prod
    # validation + approval lives in 5-deploy-prod.yml (before the prod
    # deploy). Using the `uat` environment here keeps the release→main PR
    # to a single UAT approval and avoids a duplicate Pre-Prod approval.
    # Configure required reviewers (Business users) on the `uat`
    # environment in Settings → Environments; GitHub pauses here until
    # a reviewer clicks "Approve".
    environment:
      name: uat
    steps:
      - name: Check out PR code
        uses: actions/checkout@v4

      - name: Record UAT sign-off
        run: |
          echo "UAT signed off for PR #${{ github.event.pull_request.number }}"